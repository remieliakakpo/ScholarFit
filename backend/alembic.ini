# Migrations de la base (Alembic). L'adresse de la base vient de DATABASE_URL (app/config.py),
# pas de ce fichier. L'API applique les migrations toute seule au démarrage (app/db.py).
#   alembic upgrade head                      appliquer les migrations
#   alembic revision --autogenerate -m "..."  créer une migration après avoir modifié app/models.py
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
