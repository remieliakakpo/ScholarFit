# Lance toute la plateforme : PostgreSQL + API + site.
#   docker compose up --build
# Site : http://localhost:3000   API : http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bourses
      POSTGRES_PASSWORD: bourses
      POSTGRES_DB: bourses
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bourses"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bourses:bourses@db:5432/bourses
      SECRET_KEY: ${SECRET_KEY:-change-moi-en-production-avec-une-longue-chaine}
      CORS_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.org}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulation}
      CINETPAY_APIKEY: ${CINETPAY_APIKEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_SECRET_KEY: ${CINETPAY_SECRET_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      SMTP_FROM: ${SMTP_FROM:-ScholarFit <no-reply@example.org>}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-0}
    # Pas de port publié : le navigateur passe par le site (/api relayé par Next.js).
    # Pour regarder l'API depuis la machine : décommenter (adresse locale seulement).
    # ports:
    #   - "127.0.0.1:8000:8000"
    # Preuves de paiement envoyées par les étudiants (privées, hors du site public)
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_URL:-http://localhost:3000}
    environment:
      API_URL_INTERNAL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
