# Lance toute la plateforme : PostgreSQL + API + site, configurée comme en production.
#   SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))") docker compose up --build
#   (ou mettre SECRET_KEY, POSTGRES_PASSWORD, FRONTEND_URL… dans un fichier .env à côté de ce fichier)
# Site : http://localhost:3000. Aucun compte de démo : créer l'administrateur avec
#   docker compose exec api python -m app.cli create-admin vous@exemple.org
# Pour essayer avec les comptes de démo : APP_ENV=dev docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bourses
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bourses}
      POSTGRES_DB: bourses
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bourses"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bourses:${POSTGRES_PASSWORD:-bourses}@db:5432/bourses
      APP_ENV: ${APP_ENV:-production}
      # Obligatoire : l'API refuse de démarrer sans un secret aléatoire d'au moins 32 caractères
      SECRET_KEY: ${SECRET_KEY:?Définissez SECRET_KEY (32 caractères aléatoires au moins)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # L'API n'est joignable que par le site (réseau Docker interne) : on croit son X-Forwarded-For
      TRUSTED_PROXIES: "*"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ScholarFit <no-reply@example.org>}
      SENTRY_DSN: ${SENTRY_DSN:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      # Paiement en ligne : cinetpay (clés du tableau de bord CinetPay) ou manuel (validation dans /admin)
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manuel}
      CINETPAY_APIKEY: ${CINETPAY_APIKEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_SECRET_KEY: ${CINETPAY_SECRET_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RELIEFWEB_APPNAME: ${RELIEFWEB_APPNAME:-}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-0}
    # Pas de port publié : le navigateur passe par le site (/api relayé par Next.js).
    # Pour regarder l'API depuis la machine : décommenter (adresse locale seulement).
    # ports:
    #   - "127.0.0.1:8000:8000"
    # Preuves de paiement envoyées par les étudiants (privées, hors du site public)
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_URL:-http://localhost:3000}
    environment:
      API_URL_INTERNAL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
